<header class="bego-header" id="site-header">

    <div class="bego-header__inner">

        <!-- LOGO -->
        <a
            href="/"
            class="bego-header__logo"
            aria-label="BeGO inicio"
        >
            <img
                src="/front/bego-web/assets/images/logo-bego.png"
                alt="BeGO"
            >
        </a>

        <!-- DESKTOP NAVIGATION -->
        <nav
            class="bego-nav"
            aria-label="Navegación principal"
        >

            <a
                href="#inicio"
                class="bego-nav__link"
            >
                Accueil
            </a>

            <a
                href="#como-funciona"
                class="bego-nav__link"
            >
                Comment ça marche
            </a>

            <a
                href="#viajes"
                class="bego-nav__link"
            >
                Voyages
            </a>

            <a
                href="#chauffeurs"
                class="bego-nav__link"
            >
                Chauffeurs
            </a>

            <a
                href="#bego"
                class="bego-nav__link"
            >
                À propos de BeGO
            </a>

        </nav>

        <!-- ACTIONS -->
        <div class="bego-header__actions">

            <!-- LANGUAGE -->
            <button
                class="bego-language"
                type="button"
                aria-label="Seleccionar idioma"
            >
                <span class="bego-language__globe">
                    ◉
                </span>

                <span>FR</span>

                <span class="bego-language__arrow">
                    ↓
                </span>
            </button>

            <!-- LOGIN -->
            <a
                href="/front/www/registro.html"
                class="bego-login"
            >
                connexion
            </a>

            <!-- PRIMARY CTA -->
            <a
                href="/pedir-viaje"
                class="bego-cta"
            >
                <span>Demande de voyage</span>

                <span class="bego-cta__arrow">
                    →
                </span>
            </a>

        </div>

        <!-- MOBILE MENU BUTTON -->
        <button
            class="bego-menu-button"
            id="bego-menu-button"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
        </button>

    </div>

</header>
