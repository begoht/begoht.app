<!-- =====================================================
     BEGO
     VOYAGE
===================================================== -->

<section
    id="voyages"
    class="bego-trip"
>

    <!-- =================================================
         HEADER
    ================================================== -->

    <div class="bego-trip__header">

        <span class="bego-trip__eyebrow">
            VOYAGES
        </span>

        <h2>
            Voyagez dans tout
            <span>le pays.</span>
        </h2>

    </div>


    <!-- =================================================
         BOX PRINCIPAL
    ================================================== -->

    <div class="bego-trip__box">


        <!-- =================================================
             FORMULAIRE — 50%
        ================================================== -->

        <div class="bego-trip__form">

            <!-- ORIGINE -->

            <div class="bego-trip__field">

                <label for="voyage-origin">
                    ORIGINE
                </label>

                <div class="bego-trip__input">

                    <span class="bego-trip__dot"></span>

                    <input
                        id="voyage-origin"
                        type="text"
                        placeholder="Où êtes-vous ?"
                        autocomplete="off"
                    >

                </div>

            </div>


            <!-- LIGNE -->

            <div class="bego-trip__route-line"></div>


            <!-- DESTINATION -->

            <div class="bego-trip__field">

                <label for="voyage-destination">
                    DESTINATION
                </label>

                <div class="bego-trip__input">

                    <span
                        class="bego-trip__dot bego-trip__dot--destination"
                    ></span>

                    <input
                        id="voyage-destination"
                        type="text"
                        placeholder="Où allez-vous ?"
                        autocomplete="off"
                    >

                </div>

            </div>


            <!-- BOUTON -->

            <a
                href="/front/bego-web/components/telecharger/telecharger.html"
                class="bego-trip__button"
            >

                <span>
                    Télécharger pour voyager
                </span>

                <span class="bego-trip__button-arrow">
                    ↗
                </span>

            </a>

        </div>


        <!-- =================================================
             IMAGE — 50%
        ================================================== -->

        <div class="bego-trip__visual">

            <img
                src="/front/bego-web/assets/images/voyage/bego-voyage.png"
                alt="Voyage avec BeGO"
                class="bego-trip__image"
            >

        </div>

    </div>

</section>
