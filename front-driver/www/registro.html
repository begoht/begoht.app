<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <meta
    name="color-scheme"
    content="dark"
  >

  <title>BeGO — Inscription chauffeur</title>

  <link
    rel="stylesheet"
    href="./css/driver-auth.css"
  >

</head>


<body>

  <main
    class="driver-auth-page driver-register-page"
  >

    <!-- =====================================================
         BACKGROUND LOGO
    ====================================================== -->

    <div
      class="driver-auth-background"
      aria-hidden="true"
    >

      <img
        src="./assets/logo-bego.png"
        alt=""
      >

    </div>


    <!-- =====================================================
         AUTH CARD
    ====================================================== -->

    <section
      class="driver-auth-shell"
      aria-label="Inscription chauffeur BeGO"
    >


      <!-- ===================================================
           LOGO
      ==================================================== -->

      <div class="driver-auth-logo">

        <img
          src="./assets/logo-bego.png"
          alt="BeGO"
        >

      </div>


      <!-- ===================================================
           REGISTER
      ==================================================== -->

      <section class="driver-auth-content">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="driver-auth-header">

          <h1>
            Créez votre compte.
          </h1>


        </header>


        <!-- =================================================
             NAME
        ================================================== -->

        <div class="driver-field">

          <label for="nombre">
            Nom complet
          </label>

          <input
            type="text"
            id="nombre"
            placeholder="Votre nom et prénom"
            autocomplete="name"
          >

        </div>


        <!-- =================================================
             EMAIL / PHONE
        ================================================== -->

        <div class="driver-form-grid">

          <div class="driver-field">

            <label for="email">
              Email
            </label>

            <input
              type="email"
              id="email"
              placeholder="nom@email.com"
              autocomplete="email"
            >

          </div>


          <div class="driver-field">

            <label for="telefono">
              Téléphone
            </label>

            <input
              type="tel"
              id="telefono"
              placeholder="+50937123456"
              autocomplete="tel"
            >

          </div>

        </div>


        <!-- =================================================
             PASSWORD
        ================================================== -->

        <div class="driver-field">

          <label for="password">
            Mot de passe
          </label>

          <input
            type="password"
            id="password"
            placeholder="Minimum 8 caractères"
            autocomplete="new-password"
          >

        </div>


        <!-- =================================================
             OTP
        ================================================== -->

        <div
          class="driver-otp"
          id="phoneOtpBox"
          hidden
        >

          <div class="driver-otp-header">

            <span
              class="driver-otp-icon"
              aria-hidden="true"
            >
              #
            </span>

            <div>

              <strong>
                Vérifier votre email
              </strong>

              <p id="phoneOtpHint">
                Nous vous enverrons un code de 6 chiffres
                à votre adresse email.
              </p>

            </div>

          </div>


          <div class="driver-field">

            <label for="phoneOtpCode">
              Code de vérification
            </label>

            <input
              type="text"
              id="phoneOtpCode"
              inputmode="numeric"
              maxlength="6"
              placeholder="000000"
              autocomplete="one-time-code"
            >

          </div>


          <div class="driver-otp-actions">

            <button
              type="button"
              class="driver-secondary"
              id="btnVerifyPhone"
            >
              Confirmer le code
            </button>

            <button
              type="button"
              class="driver-secondary compact"
              id="btnResendPhone"
            >
              Renvoyer
            </button>

          </div>

        </div>


        <!-- =================================================
             VEHICLE
        ================================================== -->

        <div class="driver-form-grid">

          <div class="driver-field">

            <label for="marca">
              Marque du véhicule
            </label>

            <input
              type="text"
              id="marca"
              placeholder="Honda, Yamaha..."
            >

          </div>


          <div class="driver-field">

            <label for="modelo">
              Modèle
            </label>

            <input
              type="text"
              id="modelo"
              placeholder="Wave, Navi..."
            >

          </div>

        </div>


        <!-- =================================================
             PLATE
        ================================================== -->

        <div class="driver-field">

          <label for="placa">
            Plaque d'immatriculation
          </label>

          <input
            type="text"
            id="placa"
            placeholder="Numéro de plaque"
          >

        </div>


        <!-- =================================================
             TERMS
        ================================================== -->

        <label class="driver-check">

          <input
            type="checkbox"
            id="terms"
          >

          <span>
            J'accepte les conditions d'utilisation et la
            politique de confidentialité de BeGO.
          </span>

        </label>


        <!-- =================================================
             REGISTER
        ================================================== -->

        <button
          class="driver-primary"
          id="btnRegistro"
          type="button"
        >
          Vérifier et créer mon compte
        </button>


        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div
          id="msgRegistro"
          class="driver-msg"
          role="status"
          aria-live="polite"
        ></div>


        <!-- =================================================
             INFO
        ================================================== -->

        <div class="driver-info">

          <span
            class="driver-info-mark"
            aria-hidden="true"
          >
            OK
          </span>

          <p>
            <strong>Important :</strong>
            utilisez des informations réelles afin que
            notre équipe puisse valider votre profil.
          </p>

        </div>


        <!-- =================================================
             LOGIN
        ================================================== -->

        <div class="driver-switch">

          Vous avez déjà un compte ?

          <a href="login.html">
            Se connecter
          </a>

        </div>


        <!-- =================================================
             LEGAL
        ================================================== -->

        <div class="driver-legal">

          <a
            href="https://bego.com.ht/legal.html"
            target="_blank"
            rel="noopener"
          >
            Legal, confidentialité et contact officiel
          </a>

        </div>


      </section>

    </section>

  </main>


  <!-- =======================================================
       SCRIPTS
  ======================================================== -->

  <script
    src="./js/core/production-console.js?v=20260606-console-clean"
  ></script>

  <script
    src="./js/core/conexion.js"
  ></script>

  <script
    src="./js/auth/registro.js?v=20260619-account-security"
  ></script>

  <script
    src="./js/i18n/fr.visual.js?v=20260601-fr"
  ></script>

</body>

</html>
