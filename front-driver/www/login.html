<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <meta
    name="color-scheme"
    content="dark"
  >

  <title>BeGO — Chauffeur</title>

  <link
    rel="stylesheet"
    href="./css/driver-auth.css"
  >

</head>


<body>

  <main
    class="driver-auth-page"
    id="driver-auth-page"
  >

    <!-- =====================================================
         BACKGROUND LOGO
    ====================================================== -->

    <div
      class="driver-auth-background"
      aria-hidden="true"
    >

      <img
        src="./assets/logo-bego.png"
        alt=""
      >

    </div>


    <!-- =====================================================
         AUTH CARD
    ====================================================== -->

    <section
      class="driver-auth-shell"
      aria-label="Connexion chauffeur BeGO"
    >


      <!-- ===================================================
           LOGO
      ==================================================== -->

      <div class="driver-auth-logo">

        <img
          src="./assets/logo-bego.png"
          alt="BeGO"
        >

      </div>


      <!-- ===================================================
           LOGIN
      ==================================================== -->

      <section
        class="driver-auth-content"
        id="loginSection"
      >

        <header class="driver-auth-header">

          <h1>
            Bienvenue
          </h1>

        </header>


        <!-- =================================================
             PHONE
        ================================================== -->

        <div class="driver-field">

          <label for="telefono">
            Téléphone
          </label>

          <div class="driver-input-wrap">

            <input
              type="tel"
              id="telefono"
              placeholder="+50937123456"
              autocomplete="username"
            >

          </div>

        </div>


        <!-- =================================================
             PASSWORD
        ================================================== -->

        <div class="driver-field">

          <label for="password">
            Mot de passe
          </label>

          <div class="driver-input-wrap">

            <input
              type="password"
              id="password"
              placeholder="Votre mot de passe"
              autocomplete="current-password"
            >

          </div>

        </div>


        <!-- =================================================
             OPTIONS
        ================================================== -->

        <div class="driver-login-options">

          <label class="driver-remember">

            <input
              type="checkbox"
              id="rememberMe"
            >

            <span>
              Se souvenir de moi
            </span>

          </label>


          <button
            type="button"
            class="driver-text-button"
            id="btnForgotPassword"
          >
            Mot de passe oublié ?
          </button>

        </div>


        <!-- =================================================
             ACTIONS
        ================================================== -->

        <div class="driver-actions">

          <button
            class="driver-primary"
            id="btnLogin"
            type="button"
          >
            Se connecter
          </button>


          <button
            class="driver-secondary"
            id="btnHuella"
            type="button"
          >
            <span
              class="driver-fingerprint"
              aria-hidden="true"
            >
              ◉
            </span>

            Se connecter avec empreinte
          </button>

        </div>


        <!-- =================================================
             LOGIN MESSAGE
        ================================================== -->

        <div
          id="msgLogin"
          class="driver-msg"
          role="status"
          aria-live="polite"
        ></div>


        <!-- =================================================
             PASSWORD RESET
        ================================================== -->

        <div
          class="driver-reset"
          id="passwordResetBox"
          hidden
        >

          <div class="driver-reset-header">

            <strong>
              Récupérer votre mot de passe
            </strong>

            <p>
              Entrez votre email afin de recevoir votre code.
            </p>

          </div>


          <div class="driver-field">

            <label for="resetEmail">
              Email
            </label>

            <input
              id="resetEmail"
              type="email"
              autocomplete="email"
              placeholder="nom@email.com"
            >

          </div>


          <div class="driver-field">

            <label for="resetCode">
              Code
            </label>

            <input
              id="resetCode"
              type="text"
              inputmode="numeric"
              maxlength="6"
              autocomplete="one-time-code"
              placeholder="000000"
            >

          </div>


          <div class="driver-field">

            <label for="resetPassword">
              Nouveau mot de passe
            </label>

            <input
              id="resetPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Minimum 8 caractères"
            >

          </div>


          <div class="driver-reset-actions">

            <button
              class="driver-secondary"
              id="btnSendResetCode"
              type="button"
            >
              Envoyer le code
            </button>

            <button
              class="driver-primary"
              id="btnResetPassword"
              type="button"
            >
              Modifier le mot de passe
            </button>

          </div>

        </div>


        <!-- =================================================
             GPS NOTE
        ================================================== -->

        <div class="driver-info">

          <span
            class="driver-info-mark"
            aria-hidden="true"
          >
            GPS
          </span>

          <p>
            <strong>Important :</strong>
            votre position sera vérifiée afin de vous connecter
            au système de matching.
          </p>

        </div>


        <!-- =================================================
             REGISTER
        ================================================== -->

        <div class="driver-switch">

          Vous n'avez pas encore de compte ?

          <a href="registro.html">
            Créer un compte
          </a>

        </div>


        <!-- =================================================
             LEGAL
        ================================================== -->

        <div class="driver-legal">

          <a
            href="https://bego.com.ht/legal.html"
            target="_blank"
            rel="noopener"
          >
            Legal, confidentialité et contact officiel
          </a>

        </div>

      </section>

    </section>

  </main>


  <!-- =======================================================
       SCRIPTS
  ======================================================== -->

  <script
    src="./js/core/production-console.js?v=20260606-console-clean"
  ></script>

  <script
    src="./js/core/conexion.js?v=20260710-local-login"
  ></script>

  <script
    src="./js/auth/login.js?v=20260619-account-security"
  ></script>

  <script
    type="module"
    src="./js/modules/huellas/huellas.login.js"
  ></script>

  <script
    src="./js/i18n/fr.visual.js?v=20260601-fr"
  ></script>

</body>

</html>
